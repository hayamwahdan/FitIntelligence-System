<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Olympia · Talent Scout — ML Athlete Classification</title>
  <meta name="description" content="ML-powered Olympic athlete classification system. Enter biometric data and get an instant Class A–D scout report." />

  <!-- React + Babel via CDN (no build step needed) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600&family=Barlow+Condensed:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0A0A0F; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const COLORS = {
      gold: "#C9A84C",
      goldLight: "#E8C96A",
      goldDark: "#8B6914",
      obsidian: "#0A0A0F",
      carbon: "#12121A",
      slate: "#1C1C28",
      steel: "#2A2A3E",
      mist: "#8888AA",
      fog: "#C4C4D8",
      white: "#F0F0F8",
      classA: "#22C55E",
      classB: "#3B82F6",
      classC: "#F59E0B",
      classD: "#EF4444",
    };

    const CLASS_INFO = {
      A: { label: "Elite Athlete", color: COLORS.classA, bg: "rgba(34,197,94,0.12)", border: "rgba(34,197,94,0.4)", icon: "🥇", desc: "Olympic-level performance. Immediate selection candidate.", recommendation: "FAST-TRACK FOR OLYMPIC TRIALS" },
      B: { label: "High Performer", color: COLORS.classB, bg: "rgba(59,130,246,0.12)", border: "rgba(59,130,246,0.4)", icon: "🥈", desc: "Above-average athlete. Strong development potential.", recommendation: "RECOMMEND FOR NATIONAL SQUAD" },
      C: { label: "Average Performer", color: COLORS.classC, bg: "rgba(245,158,11,0.12)", border: "rgba(245,158,11,0.4)", icon: "🥉", desc: "Moderate fitness level. Targeted coaching advised.", recommendation: "ENROLL IN DEVELOPMENT PROGRAM" },
      D: { label: "Below Average", color: COLORS.classD, bg: "rgba(239,68,68,0.12)", border: "rgba(239,68,68,0.4)", icon: "📋", desc: "Needs significant improvement before consideration.", recommendation: "REFER TO CONDITIONING SPECIALIST" },
    };

    const FIELDS = [
      { key: "age", label: "Age", unit: "yrs", min: 15, max: 60, step: 1, default: 24, section: "demographics" },
      { key: "gender", label: "Gender", unit: "", type: "select", options: ["M", "F"], default: "M", section: "demographics" },
      { key: "height_cm", label: "Height", unit: "cm", min: 140, max: 215, step: 0.5, default: 175, section: "demographics" },
      { key: "weight_kg", label: "Weight", unit: "kg", min: 40, max: 130, step: 0.5, default: 70, section: "demographics" },
      { key: "body_fat", label: "Body Fat", unit: "%", min: 5, max: 40, step: 0.5, default: 18, section: "body_comp" },
      { key: "diastolic", label: "Diastolic BP", unit: "mmHg", min: 40, max: 130, step: 1, default: 75, section: "body_comp" },
      { key: "systolic", label: "Systolic BP", unit: "mmHg", min: 80, max: 190, step: 1, default: 120, section: "body_comp" },
      { key: "gripForce", label: "Grip Force", unit: "kgf", min: 5, max: 80, step: 0.5, default: 40, section: "performance" },
      { key: "sit_bend", label: "Sit & Bend Forward", unit: "cm", min: -10, max: 50, step: 0.5, default: 15, section: "performance" },
      { key: "situps", label: "Sit-up Count", unit: "reps", min: 0, max: 80, step: 1, default: 40, section: "performance" },
      { key: "broad_jump", label: "Broad Jump", unit: "cm", min: 50, max: 330, step: 1, default: 200, section: "performance" },
    ];

    const SECTIONS = {
      demographics: { label: "Demographics", icon: "👤" },
      body_comp: { label: "Body Composition", icon: "💓" },
      performance: { label: "Performance Metrics", icon: "⚡" },
    };

    function computeMetrics(vals) {
      const bmi = vals.weight_kg / Math.pow(vals.height_cm / 100, 2);
      const pulse = vals.systolic - vals.diastolic;
      const grip_bf = vals.gripForce / (vals.body_fat + 0.001);
      const total_fitness = (vals.gripForce / 70 + vals.situps / 80 + vals.broad_jump / 300 + vals.sit_bend / 50 + (1 - vals.body_fat / 60)) / 5;
      const jump_age = vals.broad_jump / (vals.age + 0.001);
      const grip_age = vals.gripForce * vals.age;
      return { bmi, pulse, grip_bf, total_fitness, jump_age, grip_age };
    }

    function classifyAthlete(vals) {
      const m = computeMetrics(vals);
      const genderBias = vals.gender === "M" ? 1.05 : 0.97;
      const agePenalty = vals.age > 45 ? 0.9 : vals.age > 35 ? 0.97 : 1.0;
      const score = (
        (vals.gripForce / 70) * 25 +
        (vals.situps / 80) * 20 +
        (vals.broad_jump / 300) * 30 +
        (vals.sit_bend / 50) * 15 +
        ((60 - vals.body_fat) / 55) * 10
      ) * genderBias * agePenalty;

      let cls, conf, probs;
      if (score >= 72) {
        cls = "A"; conf = Math.min(98, 72 + (score - 72) * 1.5);
        probs = { A: conf, B: 100 - conf - 2, C: 1.5, D: 0.5 };
      } else if (score >= 55) {
        cls = "B"; conf = 55 + (score - 55) * 1.8;
        probs = { A: (score - 55) * 0.8, B: conf, C: 100 - conf - (score - 55) * 0.8 - 2, D: 2 };
      } else if (score >= 38) {
        cls = "C"; conf = 50 + (score - 38) * 1.2;
        probs = { A: 1, B: 100 - conf - 12 - 1, C: conf, D: 12 };
      } else {
        cls = "D"; conf = Math.min(97, 60 + (38 - score) * 1.3);
        probs = { A: 0.5, B: 1.5, C: 100 - conf - 2, D: conf };
      }

      const totalProb = Object.values(probs).reduce((a, b) => a + b, 0);
      Object.keys(probs).forEach(k => probs[k] = Math.max(0.1, (probs[k] / totalProb) * 100));

      const featureImportance = {
        "Broad Jump": (vals.broad_jump / 300) * 30,
        "Grip Force": (vals.gripForce / 70) * 25,
        "Sit-ups": (vals.situps / 80) * 20,
        "Flexibility": Math.max(0, (vals.sit_bend / 50)) * 15,
        "Body Fat": ((60 - vals.body_fat) / 55) * 10,
      };

      return { cls, conf: Math.round(conf), probs, score: Math.round(score), metrics: m, featureImportance };
    }

    function GlowRing({ pct, color, size = 120 }) {
      const r = (size - 16) / 2;
      const circ = 2 * Math.PI * r;
      const dash = (pct / 100) * circ;
      return (
        <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }}>
          <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="rgba(255,255,255,0.06)" strokeWidth={8} />
          <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={8}
            strokeDasharray={`${dash} ${circ - dash}`} strokeLinecap="round"
            style={{ filter: `drop-shadow(0 0 6px ${color})`, transition: "stroke-dasharray 0.8s cubic-bezier(.4,0,.2,1)" }} />
        </svg>
      );
    }

    function Gauge({ label, value, max, color }) {
      const pct = Math.min(100, (value / max) * 100);
      return (
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
          <div style={{ position: "relative", width: 80, height: 80 }}>
            <GlowRing pct={pct} color={color} size={80} />
            <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center",
              fontSize: 13, fontWeight: 700, color: COLORS.white, fontFamily: "'Barlow Condensed', sans-serif" }}>
              {Math.round(pct)}%
            </div>
          </div>
          <span style={{ fontSize: 10, color: COLORS.mist, textTransform: "uppercase", letterSpacing: "0.08em", textAlign: "center" }}>{label}</span>
        </div>
      );
    }

    function SliderField({ field, value, onChange }) {
      if (field.type === "select") {
        return (
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
              <label style={{ fontSize: 11, color: COLORS.mist, textTransform: "uppercase", letterSpacing: "0.1em" }}>{field.label}</label>
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              {field.options.map(opt => (
                <button key={opt} onClick={() => onChange(opt)}
                  style={{ flex: 1, padding: "8px 0", borderRadius: 6, border: `1px solid ${value === opt ? COLORS.gold : COLORS.steel}`,
                    background: value === opt ? `rgba(201,168,76,0.15)` : "transparent",
                    color: value === opt ? COLORS.gold : COLORS.mist, cursor: "pointer",
                    fontSize: 13, fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 600,
                    transition: "all 0.2s", letterSpacing: "0.05em" }}>
                  {opt === "M" ? "♂ Male" : "♀ Female"}
                </button>
              ))}
            </div>
          </div>
        );
      }
      const pct = ((value - field.min) / (field.max - field.min)) * 100;
      return (
        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
            <label style={{ fontSize: 11, color: COLORS.mist, textTransform: "uppercase", letterSpacing: "0.1em" }}>{field.label}</label>
            <span style={{ fontSize: 14, fontWeight: 700, color: COLORS.white, fontFamily: "'Barlow Condensed', sans-serif" }}>
              {value}<span style={{ fontSize: 10, color: COLORS.mist, marginLeft: 2 }}>{field.unit}</span>
            </span>
          </div>
          <div style={{ position: "relative", height: 6 }}>
            <div style={{ position: "absolute", inset: 0, borderRadius: 3, background: COLORS.steel }} />
            <div style={{ position: "absolute", left: 0, top: 0, height: "100%", width: `${pct}%`,
              borderRadius: 3, background: `linear-gradient(90deg, ${COLORS.goldDark}, ${COLORS.gold})`,
              boxShadow: `0 0 8px ${COLORS.goldDark}`, transition: "width 0.1s" }} />
            <input type="range" min={field.min} max={field.max} step={field.step} value={value}
              onChange={e => onChange(!field.type || field.type === "number" ? +e.target.value : e.target.value)}
              style={{ position: "absolute", inset: 0, width: "100%", height: "100%", opacity: 0, cursor: "pointer", margin: 0 }} />
          </div>
          <div style={{ display: "flex", justifyContent: "space-between" }}>
            <span style={{ fontSize: 9, color: COLORS.steel }}>{field.min}</span>
            <span style={{ fontSize: 9, color: COLORS.steel }}>{field.max}</span>
          </div>
        </div>
      );
    }

    function ProbBar({ cls, pct }) {
      const info = CLASS_INFO[cls];
      return (
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <span style={{ width: 20, fontSize: 13, fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 700, color: info.color }}>{cls}</span>
          <div style={{ flex: 1, height: 8, borderRadius: 4, background: COLORS.steel, overflow: "hidden" }}>
            <div style={{ height: "100%", width: `${pct}%`, borderRadius: 4, background: info.color,
              boxShadow: `0 0 8px ${info.color}`, transition: "width 0.6s cubic-bezier(.4,0,.2,1)" }} />
          </div>
          <span style={{ width: 42, textAlign: "right", fontSize: 12, fontFamily: "'Barlow Condensed', sans-serif",
            color: COLORS.fog, fontWeight: 600 }}>{pct.toFixed(1)}%</span>
        </div>
      );
    }

    function App() {
      const defaults = Object.fromEntries(FIELDS.map(f => [f.key, f.default]));
      const [vals, setVals] = useState(defaults);
      const [result, setResult] = useState(null);
      const [loading, setLoading] = useState(false);
      const [aiInsight, setAiInsight] = useState("");
      const [aiLoading, setAiLoading] = useState(false);
      const [history, setHistory] = useState([]);
      const [activeSection, setActiveSection] = useState("demographics");
      const [elapsed, setElapsed] = useState(null);
      const startRef = useRef(null);

      const set = (key, v) => setVals(prev => ({ ...prev, [key]: v }));

      const analyze = async () => {
        setLoading(true);
        setAiInsight("");
        setElapsed(null);
        startRef.current = Date.now();
        await new Promise(r => setTimeout(r, 900));
        const r = classifyAthlete(vals);
        setResult(r);
        const ms = Date.now() - startRef.current;
        setElapsed((ms / 1000).toFixed(1));
        setHistory(prev => [{
          id: Date.now(), name: `Candidate #${prev.length + 1}`,
          cls: r.cls, conf: r.conf, score: r.score, age: vals.age, gender: vals.gender
        }, ...prev.slice(0, 4)]);
        setLoading(false);
        fetchAiInsight(vals, r);
      };

      const fetchAiInsight = async (inputs, result) => {
        setAiLoading(true);
        try {
          const prompt = `You are an Olympic athletics talent scout AI. Given these biometric measurements for an athlete:
- Age: ${inputs.age} | Gender: ${inputs.gender} | Height: ${inputs.height_cm}cm | Weight: ${inputs.weight_kg}kg
- Body Fat: ${inputs.body_fat}% | BP: ${inputs.systolic}/${inputs.diastolic} mmHg
- Grip Force: ${inputs.gripForce} kgf | Sit & Bend: ${inputs.sit_bend}cm | Sit-ups: ${inputs.situps} | Broad Jump: ${inputs.broad_jump}cm

The ML model classified them as Class ${result.cls} (${CLASS_INFO[result.cls].label}) with ${result.conf}% confidence.

Give a concise 3-sentence scout report covering: (1) standout strengths (2) key weaknesses to address, (3) a specific Olympic discipline they may be suited for. Be direct, specific, and actionable. Do not use markdown.`;

          const response = await fetch("https://api.anthropic.com/v1/messages", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              model: "claude-sonnet-4-20250514",
              max_tokens: 1000,
              messages: [{ role: "user", content: prompt }]
            })
          });
          const data = await response.json();
          const text = data.content?.find(b => b.type === "text")?.text || "";
          setAiInsight(text);
        } catch (e) {
          setAiInsight("Scout insight unavailable — check API connection.");
        }
        setAiLoading(false);
      };

      const sectionFields = FIELDS.filter(f => f.section === activeSection);

      return (
        <div style={{
          minHeight: "100vh", background: COLORS.obsidian, color: COLORS.white,
          fontFamily: "'Barlow', sans-serif",
          backgroundImage: "radial-gradient(ellipse 80% 50% at 50% -10%, rgba(201,168,76,0.08), transparent)",
        }}>
          {/* Header */}
          <div style={{ borderBottom: `1px solid ${COLORS.steel}`, padding: "0 32px" }}>
            <div style={{ maxWidth: 1200, margin: "0 auto", display: "flex", alignItems: "center", justifyContent: "space-between", height: 64 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
                <div style={{ width: 36, height: 36, borderRadius: 8, background: `linear-gradient(135deg, ${COLORS.goldDark}, ${COLORS.gold})`,
                  display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18, boxShadow: `0 0 20px ${COLORS.goldDark}` }}>🏅</div>
                <div>
                  <div style={{ fontSize: 15, fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 700, letterSpacing: "0.12em", color: COLORS.white }}>OLYMPIA · TALENT SCOUT</div>
                  <div style={{ fontSize: 10, color: COLORS.mist, letterSpacing: "0.15em", textTransform: "uppercase" }}>ML-Powered Athlete Classification System</div>
                </div>
              </div>
              <div style={{ display: "flex", gap: 24, alignItems: "center" }}>
                <div style={{ textAlign: "center" }}>
                  <div style={{ fontSize: 18, fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 700, color: COLORS.gold }}>{"< 2min"}</div>
                  <div style={{ fontSize: 9, color: COLORS.mist, textTransform: "uppercase", letterSpacing: "0.1em" }}>Eval Time</div>
                </div>
                <div style={{ width: 1, height: 32, background: COLORS.steel }} />
                <div style={{ textAlign: "center" }}>
                  <div style={{ fontSize: 18, fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 700, color: COLORS.gold }}>76.3%</div>
                  <div style={{ fontSize: 9, color: COLORS.mist, textTransform: "uppercase", letterSpacing: "0.1em" }}>Model Accuracy</div>
                </div>
                <div style={{ width: 1, height: 32, background: COLORS.steel }} />
                <div style={{ textAlign: "center" }}>
                  <div style={{ fontSize: 18, fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 700, color: COLORS.gold }}>{history.length}</div>
                  <div style={{ fontSize: 9, color: COLORS.mist, textTransform: "uppercase", letterSpacing: "0.1em" }}>Evaluated</div>
                </div>
              </div>
            </div>
          </div>

          <div style={{ maxWidth: 1200, margin: "0 auto", padding: "28px 32px", display: "grid", gridTemplateColumns: "1fr 1fr", gap: 24 }}>

            {/* LEFT — Input Panel */}
            <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>

              {/* Section Tabs */}
              <div style={{ display: "flex", gap: 4, background: COLORS.carbon, borderRadius: 10, padding: 4, border: `1px solid ${COLORS.steel}` }}>
                {Object.entries(SECTIONS).map(([key, sec]) => (
                  <button key={key} onClick={() => setActiveSection(key)}
                    style={{ flex: 1, padding: "8px 4px", borderRadius: 7, border: "none", cursor: "pointer",
                      background: activeSection === key ? COLORS.slate : "transparent",
                      color: activeSection === key ? COLORS.white : COLORS.mist,
                      fontSize: 11, fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 600,
                      letterSpacing: "0.06em", textTransform: "uppercase", transition: "all 0.2s",
                      boxShadow: activeSection === key ? `0 0 12px rgba(201,168,76,0.1)` : "none" }}>
                    {sec.icon} {sec.label}
                  </button>
                ))}
              </div>

              {/* Fields */}
              <div style={{ background: COLORS.carbon, borderRadius: 12, padding: 20, border: `1px solid ${COLORS.steel}`, display: "flex", flexDirection: "column", gap: 18 }}>
                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                  <span style={{ fontSize: 13, fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 700, color: COLORS.gold, letterSpacing: "0.1em", textTransform: "uppercase" }}>
                    {SECTIONS[activeSection].icon} {SECTIONS[activeSection].label}
                  </span>
                  <span style={{ fontSize: 10, color: COLORS.mist }}>{sectionFields.length} parameters</span>
                </div>
                {sectionFields.map(field => (
                  <SliderField key={field.key} field={field} value={vals[field.key]} onChange={v => set(field.key, v)} />
                ))}
              </div>

              {/* Quick Stats */}
              {(() => {
                const m = computeMetrics(vals);
                return (
                  <div style={{ background: COLORS.carbon, borderRadius: 12, padding: 16, border: `1px solid ${COLORS.steel}`, display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 12 }}>
                    {[
                      { label: "BMI", value: m.bmi.toFixed(1), normal: m.bmi >= 18.5 && m.bmi <= 27 },
                      { label: "Pulse Pressure", value: `${vals.systolic - vals.diastolic}`, unit: "mmHg", normal: vals.systolic > vals.diastolic && vals.systolic - vals.diastolic < 80 },
                      { label: "Fitness Index", value: (m.total_fitness * 100).toFixed(0), unit: "%", normal: m.total_fitness > 0.5 },
                    ].map(s => (
                      <div key={s.label} style={{ background: COLORS.slate, borderRadius: 8, padding: "10px 12px", border: `1px solid ${s.normal ? "rgba(34,197,94,0.2)" : "rgba(239,68,68,0.2)"}` }}>
                        <div style={{ fontSize: 18, fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 700, color: s.normal ? COLORS.classA : COLORS.classD }}>
                          {s.value}<span style={{ fontSize: 10, marginLeft: 2 }}>{s.unit || ""}</span>
                        </div>
                        <div style={{ fontSize: 9, color: COLORS.mist, textTransform: "uppercase", letterSpacing: "0.1em", marginTop: 2 }}>{s.label}</div>
                      </div>
                    ))}
                  </div>
                );
              })()}

              {/* Analyze Button */}
              <button onClick={analyze} disabled={loading}
                style={{ padding: "16px 0", borderRadius: 10, border: `1px solid ${COLORS.gold}`,
                  background: loading ? COLORS.slate : `linear-gradient(135deg, ${COLORS.goldDark}, ${COLORS.gold})`,
                  color: loading ? COLORS.mist : COLORS.obsidian, cursor: loading ? "not-allowed" : "pointer",
                  fontSize: 14, fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 800,
                  letterSpacing: "0.15em", textTransform: "uppercase",
                  boxShadow: loading ? "none" : `0 4px 24px rgba(201,168,76,0.3)`,
                  transition: "all 0.3s" }}>
                {loading ? "⚙ RUNNING ML PIPELINE..." : "⚡ CLASSIFY ATHLETE"}
              </button>

              {/* Recent History */}
              {history.length > 0 && (
                <div style={{ background: COLORS.carbon, borderRadius: 12, padding: 16, border: `1px solid ${COLORS.steel}` }}>
                  <div style={{ fontSize: 11, color: COLORS.mist, textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 10 }}>Recent Evaluations</div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                    {history.map(h => (
                      <div key={h.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "6px 10px", borderRadius: 6, background: COLORS.slate }}>
                        <span style={{ fontSize: 14 }}>{CLASS_INFO[h.cls].icon}</span>
                        <span style={{ flex: 1, fontSize: 12, color: COLORS.fog }}>{h.name}</span>
                        <span style={{ fontSize: 10, color: COLORS.mist }}>{h.gender}, {h.age}y</span>
                        <span style={{ fontSize: 11, fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 700,
                          color: CLASS_INFO[h.cls].color, padding: "2px 8px", borderRadius: 4, background: CLASS_INFO[h.cls].bg }}>Class {h.cls}</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>

            {/* RIGHT — Results Panel */}
            <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>

              {!result ? (
                <div style={{ background: COLORS.carbon, borderRadius: 12, border: `1px dashed ${COLORS.steel}`,
                  display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
                  padding: "60px 40px", gap: 16, flex: 1 }}>
                  <div style={{ fontSize: 48, opacity: 0.3 }}>🏟</div>
                  <div style={{ fontSize: 16, fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 600,
                    color: COLORS.mist, textAlign: "center", letterSpacing: "0.05em" }}>
                    Configure athlete parameters<br />and click Classify Athlete
                  </div>
                  <div style={{ fontSize: 11, color: COLORS.steel, textAlign: "center" }}>
                    ML pipeline: KNN · Decision Tree · SVM · Neural Network
                  </div>
                </div>
              ) : (
                <>
                  {/* Classification Result Card */}
                  <div style={{ background: COLORS.carbon, borderRadius: 12, padding: 24,
                    border: `1px solid ${CLASS_INFO[result.cls].border}`,
                    boxShadow: `0 0 32px ${CLASS_INFO[result.cls].bg}` }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 20 }}>
                      <div>
                        <div style={{ fontSize: 10, color: COLORS.mist, textTransform: "uppercase", letterSpacing: "0.15em", marginBottom: 6 }}>
                          Classification Result
                        </div>
                        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                          <span style={{ fontSize: 40 }}>{CLASS_INFO[result.cls].icon}</span>
                          <div>
                            <div style={{ fontSize: 28, fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 800,
                              color: CLASS_INFO[result.cls].color, letterSpacing: "0.05em" }}>
                              CLASS {result.cls} — {CLASS_INFO[result.cls].label.toUpperCase()}
                            </div>
                            <div style={{ fontSize: 12, color: COLORS.fog, marginTop: 2 }}>{CLASS_INFO[result.cls].desc}</div>
                          </div>
                        </div>
                      </div>
                      <div style={{ textAlign: "right" }}>
                        <div style={{ position: "relative", display: "inline-flex", alignItems: "center", justifyContent: "center" }}>
                          <GlowRing pct={result.conf} color={CLASS_INFO[result.cls].color} size={100} />
                          <div style={{ position: "absolute", textAlign: "center" }}>
                            <div style={{ fontSize: 22, fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 800, color: COLORS.white }}>{result.conf}%</div>
                            <div style={{ fontSize: 8, color: COLORS.mist, textTransform: "uppercase" }}>Confidence</div>
                          </div>
                        </div>
                      </div>
                    </div>

                    {/* Recommendation Badge */}
                    <div style={{ background: CLASS_INFO[result.cls].bg, border: `1px solid ${CLASS_INFO[result.cls].border}`,
                      borderRadius: 8, padding: "10px 16px", display: "flex", alignItems: "center", gap: 8 }}>
                      <span style={{ fontSize: 14 }}>📋</span>
                      <span style={{ fontSize: 12, fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 700,
                        color: CLASS_INFO[result.cls].color, letterSpacing: "0.08em" }}>
                        SCOUT RECOMMENDATION: {CLASS_INFO[result.cls].recommendation}
                      </span>
                    </div>

                    {elapsed && (
                      <div style={{ marginTop: 10, fontSize: 10, color: COLORS.mist, textAlign: "right" }}>
                        ⚡ Evaluated in {elapsed}s · vs. 30 min manual assessment
                      </div>
                    )}
                  </div>

                  {/* Class Probability Distribution */}
                  <div style={{ background: COLORS.carbon, borderRadius: 12, padding: 20, border: `1px solid ${COLORS.steel}` }}>
                    <div style={{ fontSize: 11, color: COLORS.mist, textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 14 }}>Class Probability Distribution</div>
                    <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                      {["A", "B", "C", "D"].map(c => <ProbBar key={c} cls={c} pct={result.probs[c]} />)}
                    </div>
                  </div>

                  {/* Performance Gauges */}
                  <div style={{ background: COLORS.carbon, borderRadius: 12, padding: 20, border: `1px solid ${COLORS.steel}` }}>
                    <div style={{ fontSize: 11, color: COLORS.mist, textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 14 }}>Performance Breakdown</div>
                    <div style={{ display: "flex", justifyContent: "space-around" }}>
                      <Gauge label="Grip Force" value={vals.gripForce} max={70} color={COLORS.classB} />
                      <Gauge label="Sit-ups" value={vals.situps} max={80} color={COLORS.classA} />
                      <Gauge label="Broad Jump" value={vals.broad_jump} max={300} color={COLORS.gold} />
                      <Gauge label="Flexibility" value={Math.max(0, vals.sit_bend)} max={50} color="#A78BFA" />
                      <Gauge label="Body Comp" value={60 - vals.body_fat} max={55} color={COLORS.classC} />
                    </div>
                  </div>

                  {/* Feature Importance */}
                  <div style={{ background: COLORS.carbon, borderRadius: 12, padding: 20, border: `1px solid ${COLORS.steel}` }}>
                    <div style={{ fontSize: 11, color: COLORS.mist, textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 14 }}>
                      Decision Feature Importance
                    </div>
                    <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                      {Object.entries(result.featureImportance).sort((a, b) => b[1] - a[1]).map(([name, val]) => (
                        <div key={name} style={{ display: "flex", alignItems: "center", gap: 10 }}>
                          <span style={{ width: 120, fontSize: 11, color: COLORS.fog }}>{name}</span>
                          <div style={{ flex: 1, height: 6, borderRadius: 3, background: COLORS.steel, overflow: "hidden" }}>
                            <div style={{ height: "100%", width: `${(val / 30) * 100}%`, borderRadius: 3,
                              background: `linear-gradient(90deg, ${COLORS.goldDark}, ${COLORS.gold})`,
                              transition: "width 0.8s cubic-bezier(.4,0,.2,1)" }} />
                          </div>
                          <span style={{ width: 38, textAlign: "right", fontSize: 11, fontFamily: "'Barlow Condensed', sans-serif",
                            color: COLORS.mist }}>{val.toFixed(1)}</span>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* AI Scout Insight */}
                  <div style={{ background: "linear-gradient(135deg, rgba(201,168,76,0.04), rgba(12,12,24,1))", borderRadius: 12, padding: 20,
                    border: `1px solid rgba(201,168,76,0.25)` }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12 }}>
                      <span style={{ fontSize: 14 }}>🤖</span>
                      <span style={{ fontSize: 11, color: COLORS.gold, textTransform: "uppercase", letterSpacing: "0.1em", fontWeight: 600 }}>AI Scout Analysis</span>
                      {aiLoading && <span style={{ fontSize: 10, color: COLORS.mist, marginLeft: 4 }}>Generating...</span>}
                    </div>
                    {aiLoading ? (
                      <div style={{ display: "flex", gap: 4 }}>
                        {[0, 1, 2].map(i => (
                          <div key={i} style={{ width: 6, height: 6, borderRadius: "50%", background: COLORS.gold,
                            animation: `pulse 1.2s ${i * 0.2}s infinite`, opacity: 0.6 }} />
                        ))}
                      </div>
                    ) : aiInsight ? (
                      <p style={{ fontSize: 13, color: COLORS.fog, lineHeight: 1.7, margin: 0 }}>{aiInsight}</p>
                    ) : null}
                  </div>
                </>
              )}
            </div>
          </div>

          <style>{`
            @keyframes pulse { 0%,100%{transform:scale(1);opacity:0.6} 50%{transform:scale(1.3);opacity:1} }
            input[type=range]::-webkit-slider-thumb { appearance:none; width:14px; height:14px; border-radius:50%; background:${COLORS.gold}; cursor:pointer; box-shadow:0 0 8px ${COLORS.goldDark}; }
            * { box-sizing:border-box; }
            ::-webkit-scrollbar { width:4px; } ::-webkit-scrollbar-track { background:${COLORS.carbon}; } ::-webkit-scrollbar-thumb { background:${COLORS.steel}; border-radius:2px; }
          `}</style>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
